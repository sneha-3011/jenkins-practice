name: Java CI Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile Java
        run: javac Main.java
    
      - name: Create JAR File
        run: jar --create --file MyApp.jar --main-class Main Main.class

      - name: Deploy JAR to EC2
        run: |
          mkdir -p /home/ubuntu/java-app
          cd /home/ubuntu/java-app

          if [ -f MyApp.jar ]; then
            cp MyApp.jar MyApp-backup.jar
          fi

          cp "$GITHUB_WORKSPACE/MyApp.jar" MyApp.jar

          if [ -f app.pid ]; then
            kill "$(cat app.pid)" || true
          fi

          nohup java -jar MyApp.jar > app.log 2>&1 < /dev/null &
          echo $! > app.pid
      
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-build
          path: MyApp.jar