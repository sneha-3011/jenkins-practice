name: Java CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile Java
        run: javac Main.java

      - name: Run Java Application
        run: java Main
      
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-build
          path: Main.class