name: Java CI Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile Java
        run: javac Main.java

      - name: Run Java Application
        run: java Main
    
      - name: Create JAR File
        run: jar --create --file MyApp.jar --main-class Main Main.class
      
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-build
          path: MyApp.jar